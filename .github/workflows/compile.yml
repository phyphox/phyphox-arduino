# Tier T0: compile every example for every supported board, with the flash/RAM size report.
# The ESP32 rows use the default partition on purpose — a red row there means the library
# outgrew it (rewrite plan §1.7). The CO2 kit and rangefinder pull their sensor libraries in;
# the CO2 kit is the firmware of an ESP32 product (SPIFFS, WiFi) and only compiles there.
name: Compile matrix

on: [push, pull_request]

env:
  ALL_EXAMPLES: |
    - examples
  EXAMPLES_WITHOUT_CO2KIT: |
    - examples/CreateExperiment
    - examples/buttonsAndCallbacks
    - examples/connectionParameter
    - examples/getDataFromSmartphone
    - examples/getSensorDataFromSmartphone
    - examples/getSystemAndEventTime
    - examples/multigraph
    - examples/randomNumbers
    - examples/rangefinder
    - examples/readoutADC

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fqbn: esp32:esp32:esp32
            platforms: '[{"name":"esp32:esp32","source-url":"https://espressif.github.io/arduino-esp32/package_esp32_index.json"}]'
            extra: '-DLED_BUILTIN=2'
            sketches: all
          - fqbn: esp32:esp32:esp32s3
            platforms: '[{"name":"esp32:esp32","source-url":"https://espressif.github.io/arduino-esp32/package_esp32_index.json"}]'
            extra: ''
            sketches: all
          - fqbn: esp32:esp32:esp32c3
            platforms: '[{"name":"esp32:esp32","source-url":"https://espressif.github.io/arduino-esp32/package_esp32_index.json"}]'
            extra: ''
            sketches: all
          - fqbn: arduino:mbed_nano:nano33ble
            platforms: '[{"name":"arduino:mbed_nano"}]'
            extra: ''
            sketches: not-esp32
          - fqbn: arduino:samd:nano_33_iot
            platforms: '[{"name":"arduino:samd"}]'
            extra: ''
            sketches: not-esp32
          - fqbn: arduino:samd:mkrwifi1010
            platforms: '[{"name":"arduino:samd"}]'
            extra: ''
            sketches: not-esp32
          - fqbn: arduino:renesas_uno:unor4wifi
            platforms: '[{"name":"arduino:renesas_uno"}]'
            extra: ''
            sketches: not-esp32
          - fqbn: arduino:mbed_nano:nanorp2040connect
            platforms: '[{"name":"arduino:mbed_nano"}]'
            extra: ''
            sketches: not-esp32
          - fqbn: arduino:samd:mkr1000
            platforms: '[{"name":"arduino:samd"}]'
            extra: '-DPHYPHOX_BLE_NINA_SERIAL=Serial1'
            sketches: not-esp32
          - fqbn: sensebox:samd:sb
            platforms: '[{"name":"sensebox:samd","source-url":"https://raw.githubusercontent.com/sensebox/senseBoxMCU-core/master/package_sensebox_index.json"}]'
            extra: ''
            sketches: not-esp32
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          libraries: |
            - source-path: ./
            - name: ArduinoBLE
            - name: SparkFun SCD30 Arduino Library
            - name: VL53L0X
          sketch-paths: ${{ matrix.sketches == 'all' && env.ALL_EXAMPLES || env.EXAMPLES_WITHOUT_CO2KIT }}
          cli-compile-flags: |
            - --warnings
            - default
            - --build-property
            - compiler.cpp.extra_flags=${{ matrix.extra }}
          enable-deltas-report: true
          enable-warnings-report: true
      - uses: actions/upload-artifact@v4
        with:
          name: sketches-report-${{ strategy.job-index }}
          path: sketches-reports
